# Builds the Windows installer on GitHub's own runners, signs it with SignPath when that is set up,
# and attaches it to the release as Clipvault-Setup.exe (the name the website's download link uses).
#
#   git tag v1.0.1 && git push --tags      -> builds, signs, publishes the release
#   Actions tab -> Release -> Run workflow  -> builds and keeps the installer as a downloadable artifact only
#
# Signing switches on by itself once the repository variable SIGNPATH_ORGANIZATION_ID and the secret
# SIGNPATH_API_TOKEN exist (see docs/code-signing.md). Until then the installer is published unsigned.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to attach the installer to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Checks
        run: npm run check

      - name: Build the installer
        run: npm run dist

      # SignPath signs a file it receives from this same workflow run, which is how it knows the binary
      # was built from this repository (origin verification).
      - name: Keep the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: release/Clipvault-Setup.exe

      - name: Sign with SignPath
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: clipvault
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Pick the file to publish
        shell: bash
        run: |
          mkdir -p publish
          if [ -f signed/Clipvault-Setup.exe ]; then
            cp signed/Clipvault-Setup.exe publish/Clipvault-Setup.exe
            echo "SIGNING=signed with a certificate by SignPath Foundation" >> "$GITHUB_ENV"
          else
            cp release/Clipvault-Setup.exe publish/Clipvault-Setup.exe
            echo "SIGNING=not code-signed yet, so Windows will ask you to confirm" >> "$GITHUB_ENV"
          fi
          HASH=$(sha256sum publish/Clipvault-Setup.exe | cut -d' ' -f1)
          echo "HASH=$HASH" >> "$GITHUB_ENV"
          {
            echo "Windows 10 or 11, 64-bit. Run the installer, then press Ctrl+Shift+V anywhere."
            echo
            echo "This installer is $SIGNING."
            echo
            echo "SHA-256: \`$HASH\`"
            echo
            echo "Everything stays on your laptop. Nothing is sent anywhere."
          } > publish/notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file publish/notes.md
          else
            gh release create "$TAG" --title "Clipvault ${TAG#v}" --notes-file publish/notes.md
          fi
          gh release upload "$TAG" publish/Clipvault-Setup.exe --clobber

      - name: Keep the installer as a build artifact too
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: publish/Clipvault-Setup.exe
